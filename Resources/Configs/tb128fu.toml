#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# The Mu-only firmware keeps the stock ABL's UEFI window below 0x60000000.
# MemoryMapLib has the matching "UEFI FD" descriptor.
#
[uefi_fd]
base = 0x5FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# Header v1, the Mu-Silicium default. The load addresses put the boot image in
# the free 0x80000000..0x1c0000000 bank instead of the stock 0x40000000
# kernel window, which is too small for the 192 MiB payload volume.
#
[boot_image]
header_version = 1
base = 0x80000000
kernel_offset = 0x00008000
ramdisk_offset = 0x01000000
tags_offset = 0x00000100
pagesize = 4096
